name: Rappel avis Booking

on:
  schedule:
    - cron: "0 6 * * 1"   # tous les lundis ~08 h (heure de Paris)
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "Mettre à jour les 5 derniers avis Booking";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            if (open.some(i => i.title === title && !i.pull_request)) {
              core.info("Rappel déjà ouvert, rien à faire.");
              return;
            }
            const body = [
              "Rappel hebdomadaire — mise à jour des avis affichés sur le site.",
              "",
              "1. Ouvrir la page avis Booking :",
              "   https://www.booking.com/hotel/fr/chambre-d-39-hote-rodez.fr.html#tab-reviews",
              "2. Dans `data/reviews.json`, garder les **5 avis les plus récents**",
              "   (le plus récent en premier). Mettre à jour `score` et `count` si besoin.",
              "3. Renseigner `updated` avec la date du jour (format ISO).",
              "4. Commit + push sur `main`. Le site se redéploie tout seul.",
              "5. Fermer cette issue.",
              "",
              "Format d'un avis :",
              "```json",
              "{",
              '  "author": "Marie",',
              '  "country": "France",',
              '  "date": "2026-08-24",',
              '  "score": 10,',
              '  "title": "Séjour parfait",',
              '  "text": "Accueil chaleureux, chambre impeccable...",',
              '  "positive": "",',
              '  "negative": ""',
              "}",
              "```",
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
            core.info("Issue de rappel créée.");
