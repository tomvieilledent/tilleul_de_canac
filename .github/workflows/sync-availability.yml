name: Sync disponibilités Booking

on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 h
  workflow_dispatch:            # déclenchement manuel

permissions:
  contents: write

concurrency:
  group: sync-availability
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Générer public/data/availability.json depuis l'iCal Booking
        env:
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
          CI: "true"
        run: node scripts/fetch-ical.mjs

      - name: Commit si changement
        run: |
          if [[ -n "$(git status --porcelain public/data/availability.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/availability.json
            git commit -m "chore(dispos): synchronise le calendrier Booking"
            git push
          else
            echo "Aucun changement."
          fi
